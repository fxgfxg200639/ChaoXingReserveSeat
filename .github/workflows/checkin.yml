name: checkin
on:
  schedule:
    - cron: '20 0 * * *'
    - cron: '20 7 * * *'
  workflow_dispatch:
jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests cryptography numpy pillow opencv-python
      - name: Run checkin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py --method checkin --action
